# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - gen13-app-step3-1-5202-fe

on:
  push:
    branches:
      - 'main'
    paths:                         # ①画面のフォルダかこの yml が変わったときだけ動く
      - 'giftia-frontend/**'
      - '.github/workflows/main_gen13-app-step3-1-5202-fe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: giftia-frontend   # ②画面のフォルダで実行する

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: npm ci and build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}   # ③API の住所をビルドに渡す
        run: |
          npm ci
          npm run build

      - name: Zip artifact for deployment   # ④ビルドしたものを zip にまとめる（キャッシュは除く）
        run: zip -r -y ../release.zip . -x ".next/cache/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gen13-app-step3-1-5202-fe'
          slot-name: 'Production'
          package: release.zip           # ⑤zip をそのまま送る
          clean: true                    # ⑥送る前に wwwroot を空にする（古い .next のキャッシュを残さない）
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F2B73191EA84451D991D1036770837C0 }}
