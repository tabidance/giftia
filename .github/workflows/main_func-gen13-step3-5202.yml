# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - func-gen13-step3-5202

on:
  push:
    branches:
      - 'main'
    paths:                       # ①backend/ かこの yml が変わったときだけ動く
      - 'backend/**'
      - '.github/workflows/main_func-gen13-step3-5202.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: backend   # ②API のフォルダで実行する

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (check)
        run: pip install -r requirements.txt

      - name: Zip artifact for deployment   # ③backend/ の中身だけを zip にする（.funcignore と同じものを外す）
        run: zip -r ../release.zip . -x ".venv/*" "venv/*" "__pycache__/*" "*/__pycache__/*" ".pytest_cache/*" "tests/*" ".env*" "*.db"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip              # ④zip だけを渡す

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # ⑤Unzip のステップは削除（zip のまま送る）

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'func-gen13-step3-5202'
          slot-name: 'Production'
          package: release.zip           # ⑥zip をそのまま送る
          remote-build: true             # ⑥Azure 側で pip install する
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_AD95697C49BE47D3BC898DEF3DC09FF7 }}
          sku: 'flexconsumption'
